<title>Divine Alignment Oracle Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background: linear-gradient(145deg,#3D0D5E 0%,#480A52 28%,#4A0040 62%,#2A0838 100%);
  min-height:100dvh;
  font-family:'Lora','Georgia','Times New Roman',serif;
  color:#FFFFFF;
  display:flex;flex-direction:column;align-items:center;
  overflow-y:auto;
}
:root{
  --G:#D4A853;--GP:#FFFFFF;
  --serif:'Lora','Georgia','Times New Roman',serif;
  --caps:'Trebuchet MS',Arial,sans-serif;
  --BG:linear-gradient(145deg,#3D0D5E 0%,#480A52 28%,#4A0040 62%,#2A0838 100%);
  --gold:#D4A853;
}
@keyframes fin{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:0.60}50%{opacity:1}}
@keyframes borderGlow{
  0%,100%{box-shadow:0 0 6px rgba(212,168,83,.22),inset 0 0 6px rgba(212,168,83,.05);border-color:rgba(212,168,83,.50)}
  50%{box-shadow:0 0 26px rgba(212,168,83,.70),inset 0 0 16px rgba(212,168,83,.14);border-color:rgba(212,168,83,1)}
}
@keyframes bgGlow{0%,100%{opacity:.28}50%{opacity:.68}}
@keyframes fanL{0%{transform:translateX(0) rotate(0deg);opacity:0}20%{opacity:.65}60%{transform:translateX(-38px) rotate(-18deg);opacity:.55}85%{transform:translateX(-42px) rotate(-20deg);opacity:.45}100%{transform:translateX(0) rotate(0deg);opacity:0}}
@keyframes fanR{0%{transform:translateX(0) rotate(0deg);opacity:0}20%{opacity:.65}60%{transform:translateX(38px) rotate(18deg);opacity:.55}85%{transform:translateX(42px) rotate(20deg);opacity:.45}100%{transform:translateX(0) rotate(0deg);opacity:0}}
@keyframes floatUp1{0%{opacity:0;transform:translateY(4px)}40%{opacity:1}100%{opacity:0;transform:translateY(-4px)}}
@keyframes tapPulse{0%{transform:scale(1)}35%{transform:scale(0.85)}70%{transform:scale(1.05)}100%{transform:scale(1)}}
.tap-animate{animation:tapPulse 0.38s cubic-bezier(0.36,0.07,0.19,0.97) both}
.emotion-item{display:flex;flex-direction:column;align-items:center;width:100%;cursor:pointer;touch-action:manipulation;transition:transform 0.15s ease,opacity 0.15s ease}
.emotion-item:active{transform:scale(0.85)}
.btn{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(212,168,83,.82);border-radius:12px;padding:13px 8px;cursor:pointer;font-family:var(--serif);font-style:italic;font-size:13px;color:#D4A853;line-height:1.3;text-align:center;touch-action:manipulation;transition:transform 0.15s ease, background 0.18s;box-shadow:0 0 8px rgba(212,168,83,.35),inset 0 0 6px rgba(212,168,83,.07)}
.btn:active{transform:scale(0.88)}
.btn:hover{background:rgba(212,168,83,.15)}
.btn:disabled{opacity:0.75;cursor:default;transform:none}
@keyframes starTwinkle{0%,100%{opacity:.15}50%{opacity:.55}}

.cw{-webkit-perspective:1400px;perspective:1400px;width:100%}
.ci{position:relative;width:100%;padding-top:140%;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;-webkit-transition:transform 1.6s cubic-bezier(0.22,0.61,0.36,1);transition:transform 1.6s cubic-bezier(0.22,0.61,0.36,1)}
.ci.on{-webkit-transform:rotateY(0deg);transform:rotateY(0deg)}
.ci.off{-webkit-transform:rotateY(-180deg);transform:rotateY(-180deg)}
.cf,.cb{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:18px;-webkit-clip-path:inset(0 round 18px);clip-path:inset(0 round 18px);box-shadow:0 20px 60px rgba(8,2,28,.85),0 4px 16px rgba(8,2,28,.55)}
.cb{-webkit-transform:rotateY(180deg);transform:rotateY(180deg)}
.border-glow{animation:borderGlow 3.2s ease-in-out infinite}
.geo-pulse{animation:pulse 3.8s ease-in-out infinite}
.q-fadein{animation:fadeUp .7s ease both}
.fan-l{position:absolute;inset:0;border-radius:18px;border:1px solid rgba(190,150,60,.52);animation:fanL 1.1s ease-in-out both;z-index:1;overflow:hidden}
.fan-r{position:absolute;inset:0;border-radius:18px;border:1px solid rgba(190,150,60,.52);animation:fanR 1.1s ease-in-out both;z-index:1;overflow:hidden}

/* Stars canvas */
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.6}
#app{position:relative;z-index:1;width:100%;display:flex;flex-direction:column;align-items:center}
.header{width:100%;text-align:center;padding:1.2rem 1rem 0;flex-shrink:0}
.main-row{display:flex;align-items:flex-start;justify-content:center;gap:20px;width:100%;max-width:420px;padding:0 6px;flex-shrink:0}

/* SCALE */
.scale-col{width:114px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding-top:40px}
.scale-title{font-family:var(--caps);font-size:11px;font-weight:700;letter-spacing:.18em;color:#FFFFFF;text-transform:uppercase;text-align:center;margin-bottom:10px;line-height:1.6}
.emotion-label{font-family:var(--serif);font-size:11px;font-style:italic;text-align:center;line-height:1.2;width:100%;margin-bottom:3px;transition:all .25s ease;color:rgba(212,168,83,0.78)}
.emotion-label.active{color:#D4A853;font-weight:700}
.emotion-label.above{color:rgba(212,168,83,0.92)}
.emotion-label.below{color:rgba(212,168,83,0.22)}
.emotion-dot{border-radius:50%;background:rgba(212,168,83,0.60);transition:all .25s ease;flex-shrink:0}
.emotion-dot.active{background:rgba(212,168,83,0.35);border:1.5px solid #D4A853;box-shadow:0 0 0 3px rgba(212,168,83,0.14),0 0 10px rgba(212,168,83,0.48)}
.emotion-dot.above{background:rgba(212,168,83,0.60)}
.emotion-dot.below{background:rgba(212,168,83,0.14)}
.connector svg{display:block;transition:opacity .4s ease}

/* CARD COL */
.card-col{display:flex;flex-direction:column;align-items:center;width:240px;flex-shrink:0;padding-top:60px}
.question{font-family:var(--serif);font-style:italic;font-size:20px;color:#FFFFFF;line-height:1.4;margin:0 0 20px;text-align:center;width:100%}
.card-wrap{width:100%;max-width:240px;position:relative}
.card-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:140%;height:130%;background:radial-gradient(ellipse at center,rgba(122,16,96,0.12) 0%,transparent 70%);animation:bgGlow 4.5s ease-in-out infinite;pointer-events:none;z-index:0}
.card-front-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:12% 0.7rem 6%;overflow:hidden;animation:fin 1.2s}
.msg-text{font-family:var(--serif);font-size:12px;line-height:1.75;color:#D4A853;font-style:italic;text-align:center;letter-spacing:0.01em;text-wrap:balance}
.aff-text{font-family:var(--serif);font-size:11.5px;font-style:italic;color:var(--GP);line-height:1.65;text-align:center;max-width:84%;letter-spacing:0.01em;margin:0 auto 0.6rem;text-wrap:balance}
.divider{display:flex;align-items:center;gap:6px;width:55%;margin-bottom:0.6rem}
.divider-line{flex:1;height:0.5px}

/* CARD inner geo — perfectly centred square */
.card-geo{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:72%;aspect-ratio:1/1;
}

.btns{width:240px;display:flex;gap:8px;flex-shrink:0;margin-top:14px}

</style>
</head>

<!-- Splash Screen -->
<div id="splash" style="
  position:fixed;inset:0;z-index:999;

    linear-gradient(145deg,#3D0D5E 0%,#480A52 28%,#4A0040 62%,#2A0838 100%);
  transition:opacity 1.2s ease;
">
  <!-- Header — same padding as main app header -->
  <div class="header">

  <div style="height:20px"></div>

  <!-- Card fills the middle -->
  <div style="width:100%;max-width:320px;flex:1;display:flex;align-items:center;justify-content:center;padding:0.5rem 1rem">
    <div style="width:100%;position:relative;padding-top:140%;border-radius:22px;overflow:hidden;
      box-shadow:0 24px 64px rgba(8,2,28,.9),0 4px 20px rgba(8,2,28,.6);
      border:1.5px solid rgba(212,168,83,0.75)">

      <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 52%,rgba(122,16,96,.22) 0%,transparent 65%);animation:centreGlow 4s ease-in-out infinite"></div>
      <div id="splash-geo" style="position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);width:72%">
        <div style="width:100%;padding-bottom:100%;position:relative;animation:pulse 3.8s ease-in-out infinite">
          <div style="position:absolute;inset:0" id="splash-fol"></div>

      </div>
      <div style="position:absolute;bottom:20%;left:0;right:0;text-align:center;z-index:2">

    tap to begin
  </p>
</div>

<div id="app">
  <div class="header">
    <p style="font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.24em;color:#D4A853;text-transform:uppercase">✦ &nbsp;The Art of Divine Alignment&nbsp; ✦</p>
  </div>
  <div style="height:20px"></div>
  <div class="main-row">
    <div class="scale-col">
      <div class="scale-title">Emotional<br>Guidance<br>Scale</div>
      <div id="scale-items"></div>
    </div>
    <div class="card-col">
      <p class="question q-fadein">How are you feeling<br>right now?</p>
      <div class="card-wrap">
        <div class="card-glow"></div>

// ─── Starfield ────────────────────────────────────────────
(function(){
  const c=document.getElementById('stars');
  const ctx=c.getContext('2d');
  let stars=[];
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;init();}
  function init(){
    stars=[];
    for(let i=0;i<80;i++){
      stars.push({
        x:Math.random()*c.width,
        y:Math.random()*c.height,
        r:Math.random()*.9+.2,
        o:Math.random()*.4+.1,
        speed:Math.random()*.6+.2,
        phase:Math.random()*Math.PI*2
      });
    }
  }
  function draw(t){
    ctx.clearRect(0,0,c.width,c.height);
    stars.forEach(s=>{
      const flicker=s.o*(0.5+0.5*Math.sin(t/1000*s.speed+s.phase));
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(212,200,160,${flicker})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize);
  resize();
  requestAnimationFrame(draw);
})();

// ─── Flower of Life — perfectly square SVG ────────────────
function folPath(cx,cy,R,sw,op,color='#D4A853'){
  const f=v=>Number(v).toFixed(2);let s="";
  s+=`<circle cx="${cx}" cy="${cy}" r="${f(R*3.6)}" fill="none" stroke="${color}" stroke-width="${f(sw*.18)}" opacity="${f(op*.12)}"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${f(R*3.0)}" fill="none" stroke="${color}" stroke-width="${f(sw*.22)}" opacity="${f(op*.17)}"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${f(R*2.55)}" fill="none" stroke="${color}" stroke-width="${f(sw*.28)}" opacity="${f(op*.21)}"/>`;
  for(let i=0;i<6;i++){const a=i*Math.PI/3,px=cx+R*2*Math.cos(a),py=cy+R*2*Math.sin(a);s+=`<circle cx="${f(px)}" cy="${f(py)}" r="${f(R)}" fill="none" stroke="${color}" stroke-width="${f(sw*.62)}" opacity="${f(op*.50)}"/>`;}
  s+=`<circle cx="${cx}" cy="${cy}" r="${f(R*2)}" fill="none" stroke="${color}" stroke-width="${f(sw*.76)}" opacity="${f(op*.70)}"/>`;
  const r2=R*Math.sqrt(3);
  for(let i=0;i<6;i++){const a=i*Math.PI/3+Math.PI/6,px=cx+r2*Math.cos(a),py=cy+r2*Math.sin(a);s+=`<circle cx="${f(px)}" cy="${f(py)}" r="${f(R)}" fill="none" stroke="${color}" stroke-width="${f(sw*.85)}" opacity="${f(op*.68)}"/>`;}
  for(let i=0;i<6;i++){const a=i*Math.PI/3,px=cx+R*Math.cos(a),py=cy+R*Math.sin(a);s+=`<circle cx="${f(px)}" cy="${f(py)}" r="${f(R)}" fill="none" stroke="${color}" stroke-width="${f(sw)}" opacity="${f(op*.92)}"/>`;}
  s+=`<circle cx="${cx}" cy="${cy}" r="${f(R)}" fill="none" stroke="${color}" stroke-width="${f(sw)}" opacity="${f(op)}"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${f(R*.13)}" fill="${color}" opacity="${f(op*.25)}"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${f(R*.055)}" fill="${color}" opacity="${f(op*.65)}"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${f(R*.024)}" fill="#EAD9C0" opacity="1"/>`;
  return s;
}

// Always 200×200 viewBox so it renders as a perfect square
function makeFOL(opacity, extraStyle='', color='#D4A853'){
  return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"
    style="width:100%;height:100%;display:block;${extraStyle}"
    preserveAspectRatio="xMidYMid meet">
    ${folPath(100,100,28,1.35,opacity,color)}
  </svg>`;
}

function renderScale(){
  const container=document.getElementById('scale-items');
  container.innerHTML='';
  SCALE.forEach((em,idx)=>{
    const isActive=selectedIdx===idx;
    const isAbove=selectedIdx!==null&&idx<selectedIdx;
    const isBelow=selectedIdx!==null&&idx>selectedIdx;
    const isLast=idx===SCALE.length-1;
    const wrapper=document.createElement('div');
    wrapper.style.cssText='display:flex;flex-direction:column;align-items:center;width:100%';
    const label=document.createElement('div');
    label.className='emotion-label'+(isActive?' active':isAbove?' above':isBelow?' below':'');
    label.textContent=em.label;
    const dotSize=isActive?11:8;
    const dot=document.createElement('div');
    dot.className='emotion-dot'+(isActive?' active':isAbove?' above':isBelow?' below':'');
    dot.style.cssText=`width:${dotSize}px;height:${dotSize}px;margin-bottom:1px`;
    wrapper.appendChild(label);wrapper.appendChild(dot);
    wrapper.addEventListener('click',()=>generate(idx,em.level));
    container.appendChild(wrapper);
    if(!isLast){
      const lineOpacity=selectedIdx!==null?(isAbove?0.85:0.18):0.50;
      const arrowColor=isAbove?'#D4A853':'rgba(190,155,60,0.60)';
      const delay=((idx*0.2)%2).toFixed(2);
      const showChevron=idx%2===0;
      const svgNS='http://www.w3.org/2000/svg';
      const svg=document.createElementNS(svgNS,'svg');
      svg.setAttribute('width','20');svg.setAttribute('height','18');svg.setAttribute('viewBox','0 0 20 18');
      svg.style.cssText=`display:block;opacity:${lineOpacity};transition:opacity .4s ease;flex-shrink:0;margin:0 auto`;
      const line=document.createElementNS(svgNS,'line');
      line.setAttribute('x1','10');line.setAttribute('y1','0');line.setAttribute('x2','10');line.setAttribute('y2','18');
      line.setAttribute('stroke','rgba(212,168,83,0.88)');line.setAttribute('stroke-width','1.5');
      line.style.filter='drop-shadow(0 0 3px rgba(212,168,83,0.55))';
      svg.appendChild(line);
      if(showChevron){
        const chevron=document.createElementNS(svgNS,'polyline');
        chevron.setAttribute('points','4,13 10,7 16,13');chevron.setAttribute('fill','none');
        chevron.setAttribute('stroke',arrowColor);chevron.setAttribute('stroke-width','2');
        chevron.setAttribute('stroke-linecap','round');chevron.setAttribute('stroke-linejoin','round');
        chevron.style.cssText=`animation:floatUp1 2s ease-in-out infinite;animation-delay:${delay}s`;
        svg.appendChild(chevron);
      }
      container.appendChild(svg);
    }
  });
}

function renderButtons(){

  const atTop = selectedIdx === 0;
  area.innerHTML=`
    <div class="btns">
      <button class="btn" id="btn-draw">✦ Draw Another Card</button>
      ${atTop
        ? `<button class="btn" disabled style="opacity:0.75;cursor:default;border-color:rgba(212,168,83,0.6);font-style:normal;letter-spacing:0.05em;font-size:12px">✦ At the Top ✦</button>`

      <button class="btn" id="btn-share-img">✦ Share as Image</button>
      <button class="btn" id="btn-reset">✦ Reset</button>
    </div>`;
  document.getElementById('btn-draw').addEventListener('click',()=>generate(selectedIdx,level));
  if(!atTop) document.getElementById('btn-up').addEventListener('click',moveUp);
  document.getElementById('btn-share-img').addEventListener('click',shareAsImage);
  document.getElementById('btn-reset').addEventListener('click',resetAll);
}

function generate(idx,lv){
  const pool=MESSAGES[lv]||MESSAGES[9];
  const affPool=AFFS[lv]||AFFS[9];
  const prevIdx=lv===level?lastMsgIdx:-1;
  const msgIdx=randPick(pool,prevIdx);
  const affIdx=Math.floor(Math.random()*affPool.length);
  msg=pool[msgIdx]; aff=affPool[affIdx];
  lastMsgIdx=msgIdx; level=lv; selectedIdx=idx;
  renderScale(); renderButtons(); applyTaps();
  if(!firstDraw){
    shuffling=true; flipped=false;
    const ci=document.getElementById('card-inner');
    ci.classList.remove('on'); ci.classList.add('off');
    const fans=document.getElementById('fan-cards');
    const fanCardHTML = `${cardBG()}
      <div style="position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);width:72%">
        <div style="width:100%;padding-bottom:100%;position:relative">
          <div style="position:absolute;inset:0">${makeFOL(1.0)}</div>
        </div>
      </div>
      <div style="position:absolute;bottom:22%;left:0;right:0;text-align:center">
        <span style="font-family:${caps};font-size:9px;letter-spacing:.22em;color:rgba(212,168,83,0.78)">✦ DIVINE ORACLE ✦</span>
      </div>`;
    fans.innerHTML=
      `<div class="fan-l">${fanCardHTML}</div>
       <div class="fan-r">${fanCardHTML}</div>`;
    setTimeout(()=>{fans.innerHTML='';shuffling=false;},1100);
    setTimeout(()=>{drawn=true;renderCardDrawn();},500);
    setTimeout(()=>{flipped=true;ci.classList.remove('off');ci.classList.add('on');},2200);
  } else {
    drawn=true; flipped=false;
    renderCardDrawn();
    const ci=document.getElementById('card-inner');
    ci.classList.remove('off'); ci.classList.add('on');
  }
  firstDraw=false;
}

function moveUp(){

function drawFOLCanvas(ctx, cx, cy, R, color){
  ctx.strokeStyle = color;
  // Outer 6
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3, px=cx+R*2*Math.cos(a), py=cy+R*2*Math.sin(a);
    ctx.beginPath(); ctx.arc(px,py,R,0,Math.PI*2);
    ctx.lineWidth=R*.038; ctx.globalAlpha=.88; ctx.stroke();
  }
  // Mid 6
  const r2=R*Math.sqrt(3);
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3+Math.PI/6, px=cx+r2*Math.cos(a), py=cy+r2*Math.sin(a);
    ctx.beginPath(); ctx.arc(px,py,R,0,Math.PI*2);
    ctx.lineWidth=R*.044; ctx.globalAlpha=.92; ctx.stroke();
  }
  // Inner 6
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3, px=cx+R*Math.cos(a), py=cy+R*Math.sin(a);
    ctx.beginPath(); ctx.arc(px,py,R,0,Math.PI*2);
    ctx.lineWidth=R*.05; ctx.globalAlpha=.96; ctx.stroke();
  }
  // Centre
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.lineWidth=R*.05; ctx.globalAlpha=1.0; ctx.stroke();
  // Centre dot
  ctx.beginPath(); ctx.arc(cx,cy,R*.045,0,Math.PI*2);

    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){

    const a=document.createElement('a');
    a.href=url; a.download='divine-oracle-reading.png'; a.click();

    const a=i*Math.PI/3, px=cx+R*Math.cos(a), py=cy+R*Math.sin(a);
    ctx.beginPath(); ctx.arc(px,py,R,0,Math.PI*2);
    ctx.lineWidth=R*.05; ctx.globalAlpha=.96; ctx.stroke();
  }
  // Centre
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.lineWidth=R*.05; ctx.globalAlpha=1.0; ctx.stroke();
  // Centre dot
  ctx.beginPath(); ctx.arc(cx,cy,R*.045,0,Math.PI*2);
  ctx.fillStyle=color; ctx.globalAlpha=.7; ctx.fill();
  ctx.globalAlpha=1.0;
}

function wrapLines(ctx, text, maxWidth){
  const words=text.split(' '), lines=[];
  let line='';
  for(const word of words){
    const test=line+word+' ';
    if(ctx.measureText(test).width>maxWidth && line){
      lines.push(line.trim()); line=word+' ';
    } else { line=test; }
  }
  if(line.trim()) lines.push(line.trim());
  return lines;
}

async function shareAsImage(){
  if(!msg) return;
  await document.fonts.ready;

  const W=1080, H=1620;
  const canvas=document.createElement('canvas');
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext('2d');

  // Background gradient
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#3D0D5E'); bg.addColorStop(.28,'#480A52');
  bg.addColorStop(.62,'#4A0040'); bg.addColorStop(1,'#2A0838');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // Radial glow
  const rg=ctx.createRadialGradient(W*.75,H*.8,0,W*.75,H*.8,W*.6);
  rg.addColorStop(0,'rgba(122,16,96,0.45)'); rg.addColorStop(1,'rgba(122,16,96,0)');
  ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);

  // Header
  ctx.font='500 34px Cinzel, Georgia, serif';
  ctx.fillStyle='#D4A853'; ctx.textAlign='center';
  ctx.fillText('✦   THE ART OF DIVINE ALIGNMENT   ✦', W/2, 100);

  // Thin gold rule
  ctx.strokeStyle='rgba(212,168,83,0.4)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(W*.2,125); ctx.lineTo(W*.8,125); ctx.stroke();

  // Flower of Life — centred upper area
  ctx.strokeStyle='#D4A853';
  drawFOLCanvas(ctx, W/2, H*.36, 115, '#D4A853');

  // Message text — gold italic
  ctx.fillStyle='#D4A853';
  ctx.font='italic 400 52px Lora, Georgia, serif';
  ctx.textAlign='center';
  const msgLines=wrapLines(ctx, msg, W*.72);
  const msgLH=78, msgStartY=H*.58;
  msgLines.forEach((l,i)=>ctx.fillText(l, W/2, msgStartY+i*msgLH));

  // Divider — line ✦ line
  const divY=msgStartY+msgLines.length*msgLH+60;
  ctx.strokeStyle='rgba(212,168,83,0.6)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(W/2-120,divY); ctx.lineTo(W/2-24,divY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W/2+24,divY); ctx.lineTo(W/2+120,divY); ctx.stroke();
  ctx.fillStyle='#D4A853'; ctx.font='400 28px serif'; ctx.textAlign='center';
  ctx.fillText('✦', W/2, divY+9);

  // Affirmation — white italic
  ctx.fillStyle='#FFFFFF';
  ctx.font='italic 400 46px Lora, Georgia, serif';
  const affLines=wrapLines(ctx, aff, W*.65);
  const affStartY=divY+70;
  affLines.forEach((l,i)=>ctx.fillText(l, W/2, affStartY+i*72));

  // Bottom rule
  ctx.strokeStyle='rgba(212,168,83,0.35)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(W*.2,H-160); ctx.lineTo(W*.8,H-160); ctx.stroke();

  // Footer
  ctx.fillStyle='rgba(212,168,83,0.82)';
  ctx.font='500 30px Cinzel, Georgia, serif';
  ctx.fillText('✦   DIVINE ORACLE   ✦', W/2, H-110);
  ctx.fillStyle='rgba(212,168,83,0.45)';
  ctx.font='400 24px Lora, Georgia, serif';
  ctx.fillText('theartofdivinealignment.com', W/2, H-65);

  // Share or download
  canvas.toBlob(async(blob)=>{
    const file=new File([blob],'divine-oracle-reading.png',{type:'image/png'});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:'My Divine Oracle Reading'}); return; }
      catch(e){}
    }
    // Fallback: download
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='divine-oracle-reading.png'; a.click();
    URL.revokeObjectURL(url);
  },'image/png');
}

// ─── Tap effect — direct touch events, most reliable on iOS ───
function addTap(el){
  if(el._tap) return;
  el._tap = true;
  el.addEventListener('touchstart',()=>{
    el.style.transition='transform 0.12s ease';
    el.style.transform='scale(0.85)';
  },{passive:true});
  ['touchend','touchcancel'].forEach(ev=>
    el.addEventListener(ev,()=>{
      el.style.transform='scale(1.06)';
      setTimeout(()=>{ el.style.transform='scale(1)'; },130);
    },{passive:true})
  );
}
function applyTaps(){
  document.querySelectorAll('.emotion-item, .btn:not([disabled])').forEach(addTap);
}

// ─── Splash screen ────────────────────────────────────────
(function(){
  // Render FOL into splash
  const splashFol = document.getElementById('splash-fol');
  if(splashFol) splashFol.innerHTML = makeFOL(1.0);

  const splash = document.getElementById('splash');
  let dismissed = false;

  function dismiss(){
    if(dismissed) return;
    dismissed = true;
    splash.style.opacity = '0';
    setTimeout(()=>{ splash.style.display='none'; }, 1200);
  }

  // Tap to dismiss
  splash.addEventListener('click', dismiss);
  splash.addEventListener('touchend', dismiss, {passive:true});

  // Auto-dismiss after 5s
  setTimeout(dismiss, 5000);
})();

renderScale(); renderCardUndrawn(); renderCardBack(); renderButtons(); applyTaps();
</script>
